name: Prime R110 .7 firmware TSC clock control after 20 minutes

on:
  push:
    branches: [ci/prime-r110-arm64-20m-tsc-control]
    paths:
      - .github/benchmarks/prime-iso-arm64/extended-candidate-targets.json
      - .github/workflows/prime-r110-real-iso-arm64-20m-tsc-control.yml

permissions:
  contents: read

env:
  AVAILABLE_MIB: '749'
  THRESHOLD_MIB: '128'
  STOP_TARGET: '40000000000'
  PROBE_TIMEOUT_SECONDS: '1200'
  EXPECTED_TSC_HZ: '4581817600'

jobs:
  sustained-official-iso:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify and build the pinned products
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bench="$GITHUB_WORKSPACE/.github/benchmarks/prime-iso-arm64"
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          python3 "$bench/resolve-combined.py" "$bench/extended-candidate-targets.json" --reference-only-allowed \
            > "$RUNNER_TEMP/targets.tsv"
          cp "$bench/extended-candidate-targets.json" "$evidence/targets.json"
          if grep -q '^candidate' "$RUNNER_TEMP/targets.tsv"; then
            echo 'candidate=true' >> "$GITHUB_OUTPUT"
          fi
          sudo apt-get update -qq
          packages=(ninja-build libcurl4-openssl-dev zlib1g-dev
                    libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "${packages[@]}"
          while IFS=$'\t' read -r role product_sha core_sha; do
            product="$RUNNER_TEMP/product-$role"
            bash "$bench/checkout-product.sh" "$product" "$product_sha" "$core_sha"
            cp "$product/config/dependencies.lock.json" "$evidence/$role-dependencies.lock.json"
            cmake -S "$bench" -B "$RUNNER_TEMP/build-$role" -G Ninja \
              -DREVERSE_WINDOWS_SOURCE="$product" -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG'
            cmake --build "$RUNNER_TEMP/build-$role" --target session_probe --parallel 2
          done < "$RUNNER_TEMP/targets.tsv"
          cc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC -o "$RUNNER_TEMP/verified_iso.so" \
            "$bench/verified_iso.c" -lcurl -pthread
          sha256sum "$RUNNER_TEMP"/build-*/session_probe "$RUNNER_TEMP/verified_iso.so" > "$evidence/native-sha256.txt"
      - name: Start the pinned candidate and observe 12 minutes
        shell: bash
        run: |
          set -euo pipefail
          bench="$GITHUB_WORKSPACE/.github/benchmarks/prime-iso-arm64"
          evidence="$RUNNER_TEMP/evidence"
          python3 - <<'PY' > "$RUNNER_TEMP/probe-cpu"
          import os
          cpus = sorted(os.sched_getaffinity(0))[:2]
          if len(cpus) < 2:
              raise SystemExit("At least two host CPUs are required for this SMP probe")
          print(",".join(map(str, cpus)))
          PY
          {
            uname -m
            lscpu
            c++ --version
            printf 'CPU affinity %s\n' "$(cat "$RUNNER_TEMP/probe-cpu")"
          } > "$evidence/runner.txt"
          nohup bash "$bench/run-combined-role.sh" reference < /dev/null > "$evidence/reference-driver.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/reference.pid"
          python3 "$bench/wall-progress.py" "$RUNNER_TEMP" "$RUNNER_TEMP/reference-progress" 720000
      - name: Upload the late observation from the still-running reference
        uses: actions/upload-artifact@v7
        with:
          name: prime-r110-arm64-20m-firmware-tsc-12m
          path: ${{ runner.temp }}/reference-progress/
      - name: Record the same candidate at 18 minutes
        shell: bash
        run: |
          set -euo pipefail
          bench="$GITHUB_WORKSPACE/.github/benchmarks/prime-iso-arm64"
          python3 "$bench/wall-progress.py" "$RUNNER_TEMP" "$RUNNER_TEMP/candidate-18m" 1080000
      - name: Upload the 18-minute screen and counters
        uses: actions/upload-artifact@v7
        with:
          name: prime-r110-arm64-20m-firmware-tsc-18m
          path: ${{ runner.temp }}/candidate-18m/
      - name: Observe the candidate until its 20 minute bound
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          pid=$(cat "$RUNNER_TEMP/reference.pid")
          while [[ ! -f "$RUNNER_TEMP/reference.exit" ]]; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Reference driver ended before recording its exit code' >&2
              exit 1
            fi
            if [[ -s "$evidence/reference.stdout" ]]; then
              tail -n1 "$evidence/reference.stdout"
            fi
            sleep 20
          done
          if [[ -s "$evidence/reference.stdout" ]]; then tail -n1 "$evidence/reference.stdout"; fi
          test "$(cat "$RUNNER_TEMP/reference.exit")" = 0
      - name: Preserve late per-vCPU execution and IRQ evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prime-r110-arm64-20m-firmware-tsc-final
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
