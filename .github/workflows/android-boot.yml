name: REVERSE Windows Android boot

on:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "tests/**"
      - "config/dependencies.lock.json"
      - "scripts/verify_deps.py"
      - "CMakeLists.txt"
      - ".github/workflows/android-boot.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "tests/**"
      - "config/dependencies.lock.json"
      - "scripts/verify_deps.py"
      - "CMakeLists.txt"
      - ".github/workflows/android-boot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      ANDROID_ABI: ${{ matrix.abi }}
      ANDROID_APP_ID: com.reversewindows.android.ether.r020
      ANDROID_VERSION: "0.1.10"
      ANDROID_VERSION_CODE: "11"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Checkout exact component revisions
        run: |
          python3 scripts/verify_deps.py --manifest-only
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          manifest = pathlib.Path("config/dependencies.lock.json")
          for component in json.loads(manifest.read_text())["components"]:
              target = component["checkout"]
              url = "https://github.com/" + component["repository"] + ".git"
              subprocess.run(["git", "init", "--quiet", target], check=True)
              subprocess.run(["git", "-C", target, "fetch", "--quiet", "--depth", "1", url,
                              component["commit"]], check=True)
              subprocess.run(["git", "-C", target, "checkout", "--quiet", "--detach", "FETCH_HEAD"], check=True)
          PY
          python3 scripts/verify_deps.py
          printf 'MUNDO_X_SHA=%s\n' "$(git -C deps/mundo-X rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify synthetic ISO boot, CPU mode transitions, keyboard and QSSD reboot
        if: matrix.abi == 'arm64-v8a'
        run: |
          cmake -S . -B build \
            -DREVERSE_MUNDO_X_ROOT="$PWD/deps/mundo-X" \
            -DREVERSE_QSSD_ROOT="$PWD/deps/Virtual-qSSD-" \
            -DREVERSE_GPU_VIRTUAL_ROOT="$PWD/deps/GPU-VIRTUAL" \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build --target reverse_windows_android_boot_session_test \
            reverse_windows_atapi_cdrom_guest_test reverse_windows_c06_motherboard_guest_test \
            reverse_windows_protected_entry_test reverse_windows_protected_real_transition_test \
            reverse_windows_cpu_profile_test reverse_windows_lock_rmw_test \
            reverse_windows_x86_long_null_ss_test reverse_windows_x86_far_transfer64_test \
            reverse_windows_x86_system64_test reverse_windows_x64_optical_qssd_test \
            reverse_windows_x86_sse_fp32_test reverse_windows_x86_sse2_packed_oracle_test \
            reverse_windows_x86_c09r1_stage5_cvt_fxsr_test reverse_windows_x86_sse_legacy_forms_test \
            reverse_windows_x86_mmx_test reverse_windows_x86_x87_arithmetic_oracle_test \
            reverse_windows_x86_x87_state_test reverse_windows_c09r1_fxstate_test --parallel 2
          ctest --test-dir build --output-on-failure \
            -R '^(reverse_windows_android_|reverse_windows_c06_real_motherboard$|reverse_windows_protected_entry_stack$|reverse_windows_protected_real_transition$|reverse_windows_cpu_profile$|reverse_windows_lock_rmw$|reverse_windows_x64_optical_qssd$|reverse_windows_x86_(far_transfer64|system64|long_null_ss|sse|mmx|x87)|reverse_windows_x86_c09r1_stage5_cvt_fxsr$|reverse_windows_c09r1_x87_fxsave_context$)'
      - name: Install Android command-line tools and pinned packages
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace -PandroidAbi="$ANDROID_ABI" -PetherPreview=true :app:assembleDebug
      - name: Verify APK signature, manifest and native ABI
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          out="$RUNNER_TEMP/reverse-windows-$ANDROID_ABI"
          mkdir -p "$out"
          apk_name="REVERSE-Windows-Ether-$ANDROID_VERSION-$ANDROID_ABI-debug.apk"
          cp "$apk" "$out/$apk_name"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee "$out/signature.txt"
          grep -Fxq 'Number of signers: 1' "$out/signature.txt"
          signer_sha256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$out/signature.txt")
          [[ "$signer_sha256" =~ ^[[:xdigit:]]{64}$ ]]
          "$tools/zipalign" -c -P 16 -v 4 "$apk" > "$out/alignment.txt"
          "$tools/aapt" dump badging "$apk" > "$out/manifest.txt"
          grep -Fq "package: name='$ANDROID_APP_ID' versionCode='$ANDROID_VERSION_CODE' versionName='$ANDROID_VERSION'" "$out/manifest.txt"
          grep -Fxq "application-label:'REVERSE Windows Ether $ANDROID_VERSION'" "$out/manifest.txt"
          grep -Fxq "native-code: '$ANDROID_ABI'" "$out/manifest.txt"
          entry="lib/$ANDROID_ABI/libreverse_windows_android.so"
          unzip -p "$apk" "$entry" > "$RUNNER_TEMP/reverse-windows-android.so"
          readelf -h -lW "$RUNNER_TEMP/reverse-windows-android.so" > "$out/native-elf.txt"
          if [[ "$ANDROID_ABI" == arm64-v8a ]]; then
            grep -Fq 'AArch64' "$out/native-elf.txt"
            python3 - "$out/native-elf.txt" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          load = [line.split()[-1] for line in lines if line.split()[:1] == ["LOAD"]]
          assert load and all(int(value, 16) >= 16384 for value in load), load
          PY
          else
            grep -Fq 'X86-64' "$out/native-elf.txt"
          fi
          {
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'mundo_x_sha=%s\n' "$MUNDO_X_SHA"
            printf 'android_application_id=%s\n' "$ANDROID_APP_ID"
            printf 'android_version=%s\n' "$ANDROID_VERSION"
            printf 'android_version_code=%s\n' "$ANDROID_VERSION_CODE"
            printf 'android_signer_sha256=%s\n' "$signer_sha256"
            printf 'android_abi=%s\n' "$ANDROID_ABI"
            printf 'android_ndk=27.2.12479018\n'
          } > "$out/build.txt"
          cp config/dependencies.lock.json "$out/"
          (cd "$out" && sha256sum "$apk_name" > SHA256SUMS)
      - name: Publish ARM64 APK and verification
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: REVERSE-Windows-Ether-${{ env.ANDROID_VERSION }}-arm64-v8a-debug
          path: ${{ runner.temp }}/reverse-windows-arm64-v8a
          if-no-files-found: error
      - name: Enable KVM for Android runtime smoke test
        id: kvm
        if: matrix.abi == 'x86_64'
        run: |
          if [[ ! -c /dev/kvm ]]; then
            printf 'Android emulator smoke skipped because this runner lacks /dev/kvm.\n' | tee -a "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Prepare Android runtime check
        if: matrix.abi == 'x86_64' && steps.kvm.outputs.available == 'true'
        run: |
          cat > "$RUNNER_TEMP/reverse-windows-adb-smoke.sh" <<'BASH'
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          log="$RUNNER_TEMP/reverse-windows-$ANDROID_ABI/android-runtime.log"
          trap 'adb logcat -d > "$log"' EXIT
          adb install -r "$apk"
          adb logcat -c
          adb shell am start -W -n "$ANDROID_APP_ID/com.reversewindows.android.MainActivity" --ez com.reversewindows.android.SELF_TEST true
          build_fields="\"app_version\":\"$ANDROID_VERSION\",\"app_version_code\":$ANDROID_VERSION_CODE,\"application_id\":\"$ANDROID_APP_ID\",\"mundo_x_sha\":\"$MUNDO_X_SHA\""
          wait_for_state() {
            local expected="$1"
            for attempt in {1..50}; do
              if adb logcat -d -s ReverseWindows:I '*:S' > "$log" &&
                grep -Fq "$build_fields,\"schema\":\"reverse-windows-android-session-v1\",\"source\":\"self-test\",\"status\":\"$expected\"" "$log"; then
                return 0
              fi
              sleep 1
            done
            cat "$log"
            return 1
          }
          wait_for_state waiting_key
          python3 - "$log" <<'PY'
          import json
          import pathlib
          import sys

          sessions = [
              json.loads(line[line.index('{"app_version"'):])
              for line in pathlib.Path(sys.argv[1]).read_text().splitlines()
              if '{"app_version"' in line and 'reverse-windows-android-session-v1' in line
          ]
          ram = sessions[-1]["ram_profile"]
          assert ram["resident_bytes"] <= ram["backing_budget_bytes"], ram
          assert ram["spilled_bytes"] == 0 and ram["spill_writes"] == 0, ram
          assert ram["spill_mode"] in {"file", "disabled", "unavailable"}, ram
          if ram["spill_mode"] == "file":
              assert ram["spill_limit_bytes"] > 0 and not ram["spill_error"], ram
          elif ram["spill_mode"] == "unavailable":
              assert ram["spill_limit_bytes"] == 0 and ram["spill_error"], ram
          PY
          adb shell input keyevent KEYCODE_ENTER
          wait_for_state halted
          BASH
      - name: Run synthetic BIOS and keyboard on Android
        if: matrix.abi == 'x86_64' && steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/reverse-windows-adb-smoke.sh"
      - name: Preserve Android x86_64 runtime evidence
        if: always() && matrix.abi == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: REVERSE-Windows-Android-x86_64-smoke
          path: ${{ runner.temp }}/reverse-windows-x86_64
          if-no-files-found: warn
