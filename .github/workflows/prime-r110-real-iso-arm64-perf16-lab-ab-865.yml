name: Prime R110 ARM64 lab ISO .15/.16 comparison to 8.65B

on:
  push:
    branches: [ci/prime-r110-arm64-perf16-lab-ab-865]
    paths:
      - .github/benchmarks/prime-iso-arm64/ab-lab-iso-targets.json
      - .github/workflows/prime-r110-real-iso-arm64-perf16-lab-ab-865.yml

permissions:
  contents: read

env:
  AVAILABLE_MIB: '749'
  THRESHOLD_MIB: '128'
  STOP_TARGET: '8650000000'
  PROBE_TIMEOUT_SECONDS: '1250'

jobs:
  matched-official-iso:
    strategy:
      fail-fast: false
      matrix:
        role: [reference, candidate]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PROBE_ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the pinned ARM64 session
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bench="$GITHUB_WORKSPACE/.github/benchmarks/prime-iso-arm64"
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          python3 "$bench/resolve-combined.py" "$bench/ab-lab-iso-targets.json" > "$RUNNER_TEMP/targets.tsv"
          cp "$bench/ab-lab-iso-targets.json" "$evidence/targets.json"
          sudo apt-get update -qq
          packages=(ninja-build libcurl4-openssl-dev zlib1g-dev
                    libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "${packages[@]}"
          IFS=$'\t' read -r role product_sha core_sha < <(awk -F '\t' -v role="$PROBE_ROLE" '$1==role {print}' "$RUNNER_TEMP/targets.tsv")
          test "$role" = "$PROBE_ROLE"
          product="$RUNNER_TEMP/product-$role"
          bash "$bench/checkout-product.sh" "$product" "$product_sha" "$core_sha"
          cp "$product/config/dependencies.lock.json" "$evidence/$role-dependencies.lock.json"
          cmake -S "$bench" -B "$RUNNER_TEMP/build-$role" -G Ninja \
            -DREVERSE_WINDOWS_SOURCE="$product" -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG'
          cmake --build "$RUNNER_TEMP/build-$role" --target session_probe --parallel 2
          cc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC -o "$RUNNER_TEMP/verified_iso.so" \
            "$bench/verified_iso.c" -lcurl -pthread
          sha256sum "$RUNNER_TEMP"/build-*/session_probe "$RUNNER_TEMP/verified_iso.so" > "$evidence/native-sha256.txt"
      - name: Replay the verified Microsoft ISO to 8.65B
        shell: bash
        run: |
          set -euo pipefail
          bench="$GITHUB_WORKSPACE/.github/benchmarks/prime-iso-arm64"
          evidence="$RUNNER_TEMP/evidence"
          python3 - <<'PY' > "$RUNNER_TEMP/probe-cpu"
          import os
          cpus = sorted(os.sched_getaffinity(0))[:2]
          if len(cpus) < 2:
              raise SystemExit("At least two host CPUs are required for this SMP probe")
          print(",".join(map(str, cpus)))
          PY
          {
            uname -m
            lscpu
            c++ --version
            printf 'CPU affinity %s\n' "$(cat "$RUNNER_TEMP/probe-cpu")"
          } > "$evidence/runner.txt"
          bash "$bench/run-combined-role.sh" "$PROBE_ROLE" | tee "$evidence/$PROBE_ROLE-driver.log"
          python3 - "$evidence/$PROBE_ROLE.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as stream:
              result = json.load(stream)
          required = set(range(8_450_000_000, 8_650_000_000 + 1, 50_000_000))
          if not result["validated_measurement"] or required.difference(
              checkpoint["target_steps"] for checkpoint in result["checkpoints"]
          ):
              raise SystemExit("The pinned ISO run did not produce all verified 8.45–8.65B milestones")
          PY
      - name: Preserve the complete 8.45–8.65B evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prime-r110-arm64-perf16-lab-ab-865-${{ matrix.role }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
