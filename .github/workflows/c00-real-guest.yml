name: REVERSE Windows Ether boot, RAM and QSSD regressions
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-real-guest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout REVERSE Windows
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout and verify exact component revisions from the lock
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          git rev-parse HEAD
          python3 scripts/verify_deps.py --checkout
      - name: Compare r103 and r104 on identical GS, boot video and AP workloads
        shell: bash
        run: |
          baseline=af88b12d41f72a67f4a5ccd4287a58efe3e50878
          old_engine=cdf7b70ce23b4129c4d4f4404a76c49264182057
          git fetch --depth=1 origin "$baseline"
          git worktree add --detach "$RUNNER_TEMP/prime-r103" "$baseline"
          git -C deps/mundo-X fetch --depth=1 https://github.com/guadalupejuan001-code/mundo-X.git "$old_engine"
          git -C deps/mundo-X worktree add --detach "$RUNNER_TEMP/ether-r103" "$old_engine"
          bash tests/compare_r104.sh "$RUNNER_TEMP/prime-r103" "$RUNNER_TEMP/ether-r103" build/r104 | tee build-r104.log
      - uses: actions/upload-artifact@v4
        with:
          name: prime-r104-measurements-${{ matrix.architecture }}
          path: build-r104.log
      - name: Measure ARM64 dispatch and REP with an IRQ held by priority
        shell: bash
        run: |
          baseline=9e6baec677e7a90f7b593e2a5651cc7623300dc9
          git fetch --no-tags --depth=1 origin "$baseline"
          git worktree add --detach "$RUNNER_TEMP/prime-r101-irq" "$baseline"
          bash tests/compare_smp_irq.sh "$RUNNER_TEMP/prime-r101-irq" build
      - name: Measure partial VRAM and vCPU grants against r102
        shell: bash
        run: |
          baseline=702edd72455ad1242a4d9de53f21a57773dcc5ec
          git fetch --no-tags --depth=1 origin "$baseline"
          git worktree add --detach "$RUNNER_TEMP/prime-r102-vram" "$baseline"
          bash tests/compare_r103.sh "$RUNNER_TEMP/prime-r102-vram" build | tee build/r103-summary.log
      - uses: actions/upload-artifact@v4
        with:
          name: prime-r103-measurements-${{ matrix.architecture }}
          path: build/r103-summary.log
      - name: Compare 0.3.65 and current engines on equal guest work
        shell: bash
        run: |
          set -euo pipefail
          previous=73146f88beb8c2bcdeca157b1939bffa4a6da546
          baseline="$RUNNER_TEMP/prime-previous-engine"
          previous_prime=a08f47ce18e170a5d6fb3e3ff515924e8ce422c9
          git fetch --no-tags --depth=1 origin "$previous_prime"
          git worktree add --detach "$RUNNER_TEMP/prime-0.3.66" "$previous_prime"
          if ! git -C deps/mundo-X cat-file -e "$previous^{commit}" 2>/dev/null; then
            git -C deps/mundo-X fetch --no-tags --depth=1 https://github.com/guadalupejuan001-code/mundo-X.git "$previous"
          fi
          git -C deps/mundo-X worktree add --detach "$baseline" "$previous"
          mkdir -p build
          compile_engine() {
            c++ -std=c++17 -O2 -DNDEBUG -frounding-math -pthread -I"$3/src" \
              -I"$1/pc-android/native" -I"$1/native/include" \
              -Ideps/Virtual-qSSD-/include -Ideps/GPU-VIRTUAL/include \
              tests/prime_execution_bench.cpp -lz -o "$2"
          }
          compile_engine "$baseline" build/engine-before "$RUNNER_TEMP/prime-0.3.66"
          compile_engine deps/mundo-X build/engine-after .
          for trial in 1 2 3 4 5 6 7; do
            order=(before after)
            if (( trial % 2 == 0 )); then order=(after before); fi
            for version in "${order[@]}"; do "./build/engine-$version" "$version"; done
          done | tee build/prime-execution.log
          python3 tests/compare_execution.py build/prime-execution.log | tee -a build/prime-execution.log
      - name: Measure the execution target with the production Android session
        shell: bash
        run: |
          set -euo pipefail
          previous_engine=18f2c012c9dee2cedb3c18089c4d8ae05f2917e1
          git -C deps/mundo-X fetch --no-tags --depth=1 https://github.com/guadalupejuan001-code/mundo-X.git "$previous_engine"
          git -C deps/mundo-X worktree add --detach "$RUNNER_TEMP/ether-0.3.66" "$previous_engine"
          compile_window() {
            local app="$1" engine="$2" output="$3"
            shift 3
            c++ -std=c++17 -O2 -DNDEBUG -frounding-math -pthread "$@" -I"$app/src" \
              -I"$engine/pc-android/native" -I"$engine/native/include" \
              -Ideps/Virtual-qSSD-/include -Ideps/GPU-VIRTUAL/include tests/android_boot_session_test.cpp -lz -o "$output"
          }
          compile_window "$RUNNER_TEMP/prime-0.3.66" "$RUNNER_TEMP/ether-0.3.66" build/window-before -DPRIME_PREVIOUS_ENGINE_WINDOW=1
          compile_window . deps/mundo-X build/window-after
          for trial in 1 2 3 4 5; do
            order=(before after)
            if (( trial % 2 == 0 )); then order=(after before); fi
            for version in "${order[@]}"; do
              for argument in --measure-engine-window --measure-engine-mix; do
                ./build/window-"$version" "$argument" | sed "s/^/$version /"
              done
            done
            ./build/window-after --sustain-engine-window | sed 's/^/after /'
          done | tee build/prime-engine-window.log
          python3 tests/compare_execution.py --windows build/prime-engine-window.log
      - name: Save paired execution window measurements
        uses: actions/upload-artifact@v4
        with:
          name: prime-engine-window-${{ matrix.architecture }}
          path: build/prime-engine-window.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Measure exact x86 loops and individually executed instructions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          c++ -std=c++17 -O2 -DNDEBUG -frounding-math -pthread \
            -I deps/mundo-X/pc-android/native -I deps/mundo-X/native/include \
            deps/mundo-X/pc-android/native/tests/x86_ether_counter_loop_test.cpp \
            -o build/prime-x86-measure
          ./build/prime-x86-measure | tee build/prime-x86-measure.log
          grep -q '^ETHER_ACCUMULATOR_64BIT_BUDGET_PASS equivalent_steps=369000000000000 ' build/prime-x86-measure.log
          grep -q '^ETHER_WIDE_MULTIPLY_LOOP_PASS ' build/prime-x86-measure.log
          grep -q '^ETHER_ROTATE_XOR_PASS ' build/prime-x86-measure.log
          grep -q '^ETHER_TIMED_ROTATE_XOR_PASS steps=2000000$' build/prime-x86-measure.log
          grep -q '^ETHER_AFFINE_RAM_ROTATE_PASS cases=12 changing_ram=1 mmio=1 device_clock=1$' build/prime-x86-measure.log
          ./build/prime-x86-measure --measure-wide-multiply | tee -a build/prime-x86-measure.log
          ./build/prime-x86-measure --measure-mixed | tee -a build/prime-x86-measure.log
          grep -q '^ETHER_X86_MIXED_PASS mode=interpreter steps=110000001 native_steps=0 ' build/prime-x86-measure.log
          if [ "$(uname -m)" = "aarch64" ]; then
            grep -Eq '^ETHER_X86_MIXED_PASS mode=arm64 steps=110000001 native_steps=[1-9][0-9]* ' build/prime-x86-measure.log
          fi
      - name: Compare mixed Windows vector stores with Prime 0.3.72
        shell: bash
        run: |
          set -euo pipefail
          reference=1154148d3194a7081bee80bff831e87292d33e68
          old="$RUNNER_TEMP/mundo-prime-r097"
          git -C deps/mundo-X fetch --no-tags --depth=1 https://github.com/guadalupejuan001-code/mundo-X.git "$reference"
          git -C deps/mundo-X worktree add --detach "$old" "$reference"
          driver=pc-android/native/tests/x86_ether_counter_loop_test.cpp
          cp "deps/mundo-X/$driver" "$old/pc-android/native/tests/prime-vector-compare.cpp"
          c++ -std=c++17 -O2 -DNDEBUG -frounding-math -pthread \
            -I"$old/pc-android/native" -I"$old/native/include" \
            "$old/pc-android/native/tests/prime-vector-compare.cpp" -o build/prime-vector-r097
          for trial in 1 2 3 4 5; do
            order=(r097 r098)
            if (( trial % 2 == 0 )); then order=(r098 r097); fi
            for version in "${order[@]}"; do
              binary=build/prime-x86-measure
              if [[ $version == r097 ]]; then binary=build/prime-vector-r097; fi
              "$binary" --measure-mixed-movntdq | sed "s/^/$version /"
            done
          done | tee build/prime-vector-stream.log
      - uses: actions/upload-artifact@v4
        with:
          name: prime-vector-stream-${{ matrix.architecture }}
          path: build/prime-vector-stream.log
      - name: Compare disp32 vector stores with Prime 0.3.74
        shell: bash
        run: |
          set -euo pipefail
          reference=43cc1adef7921a8dbd82c2c539ac9a4297145916
          old="$RUNNER_TEMP/mundo-prime-r099"
          git -C deps/mundo-X fetch --no-tags --depth=1 https://github.com/guadalupejuan001-code/mundo-X.git "$reference"
          git -C deps/mundo-X worktree add --detach "$old" "$reference"
          driver=pc-android/native/tests/x86_ether_counter_loop_test.cpp
          cp "deps/mundo-X/$driver" "$old/$driver"
          c++ -std=c++17 -O2 -DNDEBUG -frounding-math -pthread \
            -I"$old/pc-android/native" -I"$old/native/include" "$old/$driver" -o build/prime-x86-r099
          for trial in 1 2 3 4 5; do
            order=(prime-x86-r099 prime-x86-measure)
            if (( trial % 2 == 0 )); then order=(prime-x86-measure prime-x86-r099); fi
            for binary in "${order[@]}"; do
              "build/$binary" --measure-disp32-movntdq | sed "s/^/$binary /"
            done
          done | tee build/prime-disp32.log
      - uses: actions/upload-artifact@v4
        with:
          name: prime-disp32-${{ matrix.architecture }}
          path: build/prime-disp32.log
      - name: Compare full and partial VBE frames with identical guest writes
        shell: bash
        run: |
          set -euo pipefail
          old_app="$RUNNER_TEMP/prime-r097"
          reference=67f385fa63a1cb56f8f19c7d61d19273075f841e
          git fetch --no-tags --depth=1 origin "$reference"
          git worktree add --detach "$old_app" "$reference"
          compile_display() {
            c++ -std=c++17 -O2 -DNDEBUG -frounding-math -pthread -I"$1/src" \
              -I"$2/pc-android/native" -I"$2/native/include" \
              -Ideps/Virtual-qSSD-/include -Ideps/GPU-VIRTUAL/include \
              tests/prime_vbe_guest_test.cpp -lz -o "$3"
          }
          compile_display "$old_app" "$RUNNER_TEMP/mundo-prime-r097" build/vbe-r097
          compile_display . deps/mundo-X build/vbe-r098
          for trial in 1 2 3 4 5; do
            order=(r097 r098)
            if (( trial % 2 == 0 )); then order=(r098 r097); fi
            for version in "${order[@]}"; do
              "build/vbe-$version" --measure | sed "s/^/$version /"
            done
          done | tee build/prime-vbe-compare.log
      - uses: actions/upload-artifact@v4
        with:
          name: prime-vbe-compare-${{ matrix.architecture }}
          path: build/prime-vbe-compare.log
      - name: Compile native boot probe against actual x86/x64 CPU
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri zlib1g-dev
          cmake -S . -B build -DREVERSE_MUNDO_X_ROOT="$PWD/deps/mundo-X" -DREVERSE_QSSD_ROOT="$PWD/deps/Virtual-qSSD-" -DREVERSE_GPU_VIRTUAL_ROOT="$PWD/deps/GPU-VIRTUAL" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Verify PrimeVGC guest transfers and measure bulk QSSD bandwidth
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2 --target reverse_windows_primevgc_transfer_test reverse_windows_primevgc_compute_test
          for sample in 1 2 3; do
            ./build/reverse_windows_primevgc_transfer_test
          done | tee build/primevgc-transfer.log
          grep -q '^PRIME_C08_PRIMEVGC_VRAM_PASS logical_bytes=120000000000 last_byte=119999999999' build/primevgc-transfer.log
          for sample in 1 2 3; do
            ./build/reverse_windows_primevgc_transfer_test --bulk-512k
            ./build/reverse_windows_primevgc_transfer_test --bulk
          done | tee build/primevgc-bulk.log
          grep -q 'exact_bytes=268435456 .*command_bytes=524288 upload_commits=512' build/primevgc-bulk.log
          grep -q 'exact_bytes=268435456 .*command_bytes=8388608 upload_commits=32' build/primevgc-bulk.log
          ./build/reverse_windows_primevgc_compute_test | tee build/primevgc-compute.log
      - name: Build the remaining native regressions
        run: |
          cmake --build build --parallel 2
      - name: Execute real x86 and long-mode x64 guest demos
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: ctest --test-dir build --output-on-failure
      - name: Compare the guest clocks on sixteen vCPUs with identical arithmetic
        shell: bash
        run: ./build/reverse_windows_smp_guest_test --measure-cpu-clock | tee build/prime-smp-clock.log
      - name: Verify Prime C08 PCI, QSSD VRAM, and REgraphics rasterization
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          for sample in 1 2 3 4; do
            ./build/reverse_windows_prime_gpu_guest_test
          done | tee build/prime-c08-gpu.log
          grep -q '^PRIME_C08_REGRAPHICS_PASS .*"vram_draw_requests":1.*"ram_draw_requests":3.*"color_dma_reads":2.*"submitted_triangles":3' build/prime-c08-gpu.log
          grep -q '^PRIME_C08_BGRA_DMA_PASS alpha_ticket=18 vbe_stores=0 .*"alpha_draw_ticket":18' build/prime-c08-gpu.log
          grep -q '^PRIME_C08_SINGLE_DMA_PASS bytes=1228800 legacy_commands=6 commands=1' build/prime-c08-gpu.log
          grep -q '^PRIME_C08_SCHEDULED_DMA_PASS msi=6 fence=104 fault=105 preempt=205 pixels=4096 .* high_dma=1$' build/prime-c08-gpu.log
          grep -q '^PRIME_C08_PCI_VRAM_PASS logical_bytes=120000000000 last_byte=119999999999 .* exact=1' build/prime-c08-gpu.log
          grep -q '^PRIME_C08_VRAM_BATCH_PASS bytes=7864320 .* commits=128 .* exact=1' build/prime-c08-gpu.log
      - name: Record Prime BIOS keyboard and PS/2 regressions
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure -V \
            -R '^reverse_windows_(pc_bios_keyboard|android_bios_iso_qssd|c06_real_motherboard)$' \
            | tee build/prime-bios-keyboard.log
          grep -q 'PRIME_C03_NATIVE_SESSION_PASS translated_steps=' build/prime-bios-keyboard.log
          grep -q 'PRIME_C10_WBINVD_SESSION_PASS count=1 resume=1' build/prime-bios-keyboard.log
          grep -q 'PRIME_RAM64_QSSD_PACKED_PASS guest_bytes=68719476736 .*guest_test_bytes=65536 qssd_test_bytes=32768 ' build/prime-bios-keyboard.log
          grep -q 'PRIME_UNIFIED_SESSION_PASS ram=68719476736 vram=120000000000 ' build/prime-bios-keyboard.log
          grep -q 'C06_TIMED_ROTATE_XOR_PASS steps=32000028 ' build/prime-bios-keyboard.log
          grep -q 'PRIME_IOAPIC_ID_X64_PASS paged=1 version=1 arbitration=1 reset=1' build/prime-bios-keyboard.log
      - name: Measure InfiniteCore through x86 memory operands
        run: |
          set -euo pipefail
          ./build/reverse_windows_pc_memory_fabric_test | tee build/prime-infinitecore.log
          grep -q '^PRIME_C09_ETHER_INFINITECORE_PASS iterations=1024 ' build/prime-infinitecore.log
      - name: Verify Prime C02 timing and checkpoint evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('build/prime-c02-boot-profile.json'))
          assert report['host_architecture'] == '${{ matrix.architecture }}'
          assert report['matching_guest_states'] and report['matching_long_mode_state']
          assert report['repeat_count'] == 3
          print('Prime C02', report['host_architecture'], report['fixture_sha256'],
                report['guest_state']['current']['steps'], report['timing'])
          PY
      - name: Verify and measure Prime C03 native ARM64 blocks
        shell: bash
        run: |
          set -euo pipefail
          ./build/reverse_windows_prime_ether_arm64_test | tee build/prime-c03-ether-arm64.log
          if [ "$(uname -m)" = "aarch64" ]; then
            grep -q '^PRIME_C03_ARM64_PASS ' build/prime-c03-ether-arm64.log
            grep -q '^PRIME_ETHER_ROTATION_PASS cases=96 flags=1 stack=1 exact_steps=1$' build/prime-c03-ether-arm64.log
            grep -q '^PRIME_ETHER_VARIABLE_ROTATION_PASS cases=144 flags=1 ram=1$' build/prime-c03-ether-arm64.log
            grep -q '^PRIME_ARM64_PROTECTED32_PASS ' build/prime-c03-ether-arm64.log
            grep -q '^PRIME_ARM64_BYTE_COPY_PASS ' build/prime-c03-ether-arm64.log
            grep -q '^PRIME_ETHER_INTEGER_PASS mode=protected32 ' build/prime-c03-ether-arm64.log
            grep -q '^PRIME_ETHER_INTEGER_PASS mode=long64 ' build/prime-c03-ether-arm64.log
            grep -q '^PRIME_ETHER_RIP_RELATIVE_PASS$' build/prime-c03-ether-arm64.log
            grep -q '^PRIME_ETHER_SIGNED_BOOT_PASS ' build/prime-c03-ether-arm64.log
            grep -q '^PRIME_ETHER_RMW_BOOT_PASS ' build/prime-c03-ether-arm64.log
            sed -n 's/^PRIME_C03_ARM64_BENCH //p' build/prime-c03-ether-arm64.log > build/prime-c03-ether-arm64.json
            python3 -m json.tool build/prime-c03-ether-arm64.json >/dev/null
          else
            grep -q '^PRIME_C03_ARM64_FALLBACK_PASS ' build/prime-c03-ether-arm64.log
          fi
      - name: Record Prime C04 RAM, address map and pressure evidence
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure -V \
            -R '^reverse_windows_(sparse_ram|pc_memory|pc_memory_fabric|x86_long_mode|x86_ether_rep_batch|android_bios_iso_qssd)$' \
            | tee build/prime-c04-ram.log
          for marker in SPARSE_WORD TRANSLATION REP_FILL ANDROID_PRESSURE SHARED_RAM; do
            grep -q "PRIME_C04_${marker}_PASS" build/prime-c04-ram.log
          done
      - name: Capture BIOS disk boot and guest VGA evidence
        run: |
          set -euo pipefail
          ./build/reverse_windows_bios_disk_test | tee build/c03-bios-disk.log
          grep -q C03_BIOS_CD_QSSD_DISCOVERY_PASS build/c03-bios-disk.log
          python3 tests/c03_render_vga.py build/c03-boot-evidence.json build/c03-qssd-vga.svg
      - name: Verify x64 transfers through optical boot data and QSSD reboot
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure -V \
            -R '^(reverse_windows_x64_optical_qssd|reverse_windows_x86_(far_transfer64|system64|long_null_ss))$'
      - name: Capture C02 MMX, SSE, x87 and FXSR conformance evidence
        shell: bash
        run: |
          set -euo pipefail
          uname -m | tee build/c02-cpu-conformance.log
          lscpu | sed -n '/^Vendor ID:/p; /^Model name:/p' | tee -a build/c02-cpu-conformance.log
          git -C deps/mundo-X rev-parse HEAD | tee -a build/c02-cpu-conformance.log
          ctest --test-dir build -V -R \
            '^(reverse_windows_x86_(mmx|sse_legacy_forms|x87_arithmetic_oracle|x87_state)|reverse_windows_c09r1_x87_(fxsave_context|deferred_mf)|reverse_windows_c05_real_cpl3_tss)$' \
            | tee -a build/c02-cpu-conformance.log
      - name: Capture authentic C06 PCI PIC PIT APIC ACPI guest evidence
        run: |
          set -euo pipefail
          ./build/reverse_windows_c06_motherboard_guest_test | tee build/reverse-windows-c06-motherboard.log
          grep -q 'C06_PIC_PIT_GUEST_IRQ_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C02_X87_LEGACY_FERR_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C03_ATAPI_IRQ15_STI_HLT_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'ETHER_BOOT_IRQ_TIMING_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C06_PCI_ACPI_CMOS_REAL_GUEST_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C06_IOAPIC_LAPIC_MMIO_IRQ_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C06_APIC_NESTED_HLT_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C06_APIC_DIVISOR_MSR_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C06_APIC_TSC_HLT_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C06_CR8_LAPIC_TPR_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'PRIME_C05_PCI_ENUMERATION_PASS profiles=4 slots=32' build/reverse-windows-c06-motherboard.log
          grep -q 'PRIME_C05_ACPI_SCI_PASS route=pic' build/reverse-windows-c06-motherboard.log
          grep -q 'PRIME_C05_ACPI_SCI_PASS route=ioapic' build/reverse-windows-c06-motherboard.log
          grep -q 'PRIME_C05_PIT_CALIBRATION_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'PRIME_C05_BIOS_CLOCK_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'REVERSE_WINDOWS_C06_MOTHERBOARD_PASS' build/reverse-windows-c06-motherboard.log
      - name: Verify real C07 guest PCI ATA PIO IRQ14 and durable QSSD replay
        shell: bash
        run: |
          set -euo pipefail
          ./build/reverse_windows_c07_ata_guest_test | tee build/reverse-windows-c07-ata.log
          for marker in C07_REAL_GUEST_PCI_ATA_PIO_IRQ_PASS \
            C03_QSSD_IDENTIFY_DEVICE_PASS \
            C07_LBA48_HIGH_SPARSE_GUEST_PASS \
            C07_ATA_PIO_MULTI_SECTOR_PASS \
            C07_ATA_COMMAND_ERRORS_PASS \
            C07_ATA_PARTIAL_RESET_PASS \
            C07_SAME_MACHINE_REBOOT_PASS \
            C07_QSSD_DURABILITY_REOPEN_PASS \
            C07_BIOS_ATA_SINGLE_QSSD_PASS \
            C07_QSSD_CORRUPT_REJECT_TORN_RECOVER_PASS \
            REVERSE_WINDOWS_C07_REAL_ATA_PASS; do
            grep -q "$marker" build/reverse-windows-c07-ata.log
          done
      - name: Verify C08 checkpoint, corruption, crash, compact and C07 ATA compatibility
        shell: bash
        run: |
          set -euo pipefail
          ./build/reverse_windows_c08_maintenance_test | tee build/reverse-windows-c08-maintenance.log
