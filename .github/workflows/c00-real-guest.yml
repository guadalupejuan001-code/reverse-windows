name: C02 CPU conformance and virtual hardware regressions
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-real-guest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout REVERSE Windows
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout canonical Mundo X CPU (exact SHA)
        uses: actions/checkout@v7
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: a7da66afba08a30121e9e8e9904bc2602e6ab801
          path: deps/mundo-X
          persist-credentials: false
      - name: Checkout GPU-VIRTUAL C12 plus physical work authority
        uses: actions/checkout@v7
        with:
          repository: guadalupejuan001-code/GPU-VIRTUAL
          ref: dd89b4c2ba8cb7908bb8f0bb9eb8f20b75ead7d9
          path: deps/GPU-VIRTUAL
          persist-credentials: false
      - name: Checkout QSSD current StateBus plus graphics revisions
        uses: actions/checkout@v7
        with:
          repository: guadalupejuan001-code/Virtual-qSSD-
          ref: 5555f1cfc95e50d60df5d7481317380a6c5891d8
          path: deps/Virtual-qSSD-
          persist-credentials: false
      - name: Checkout REVERSE-PC C03 integrated host candidate
        uses: actions/checkout@v7
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: 6727d8a34fa722ee2a0662e98b8917ac4d53d4f5
          path: deps/REVERSE-PC
          persist-credentials: false
      - name: Enforce exact component SHAs and real source files
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          git rev-parse HEAD
          python3 scripts/verify_deps.py
      - name: Compile native boot probe against actual x86/x64 CPU
        run: |
          cmake -S . -B build -DREVERSE_MUNDO_X_ROOT="$PWD/deps/mundo-X" -DREVERSE_QSSD_ROOT="$PWD/deps/Virtual-qSSD-" -DREVERSE_GPU_VIRTUAL_ROOT="$PWD/deps/GPU-VIRTUAL" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Execute real x86 and long-mode x64 guest demos
        run: ctest --test-dir build --output-on-failure
      - name: Capture C02 MMX, SSE, x87 and FXSR conformance evidence
        shell: bash
        run: |
          set -euo pipefail
          uname -m | tee build/c02-cpu-conformance.log
          lscpu | sed -n '/^Vendor ID:/p; /^Model name:/p' | tee -a build/c02-cpu-conformance.log
          git -C deps/mundo-X rev-parse HEAD | tee -a build/c02-cpu-conformance.log
          ctest --test-dir build -V -R \
            '^(reverse_windows_x86_(mmx|sse_legacy_forms|x87_arithmetic_oracle|x87_state)|reverse_windows_c09r1_x87_(fxsave_context|deferred_mf)|reverse_windows_c05_real_cpl3_tss)$' \
            | tee -a build/c02-cpu-conformance.log
      - name: Capture authentic C06 PCI PIC PIT APIC ACPI guest evidence
        run: |
          set -euo pipefail
          ./build/reverse_windows_c06_motherboard_guest_test | tee build/reverse-windows-c06-motherboard.log
          grep -q 'C06_PIC_PIT_GUEST_IRQ_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C02_X87_LEGACY_FERR_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C06_PCI_ACPI_CMOS_REAL_GUEST_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'C06_IOAPIC_LAPIC_MMIO_IRQ_PASS' build/reverse-windows-c06-motherboard.log
          grep -q 'REVERSE_WINDOWS_C06_MOTHERBOARD_PASS' build/reverse-windows-c06-motherboard.log
      - name: Verify real C07 guest PCI ATA PIO IRQ14 and durable QSSD replay
        shell: bash
        run: |
          set -euo pipefail
          ./build/reverse_windows_c07_ata_guest_test | tee build/reverse-windows-c07-ata.log
          for marker in C07_REAL_GUEST_PCI_ATA_PIO_IRQ_PASS \
            C07_LBA48_HIGH_SPARSE_GUEST_PASS \
            C07_ATA_PIO_MULTI_SECTOR_PASS \
            C07_ATA_COMMAND_ERRORS_PASS \
            C07_ATA_PARTIAL_RESET_PASS \
            C07_SAME_MACHINE_REBOOT_PASS \
            C07_QSSD_DURABILITY_REOPEN_PASS \
            C07_BIOS_ATA_SINGLE_QSSD_PASS \
            C07_QSSD_CORRUPT_REJECT_TORN_RECOVER_PASS \
            REVERSE_WINDOWS_C07_REAL_ATA_PASS; do
            grep -q "$marker" build/reverse-windows-c07-ata.log
          done
      - name: Verify C08 checkpoint, corruption, crash, compact and C07 ATA compatibility
        shell: bash
        run: |
          set -euo pipefail
          ./build/reverse_windows_c08_maintenance_test | tee build/reverse-windows-c08-maintenance.log
          grep -q 'C08_ATOMIC_COMPACTION_PASS' build/reverse-windows-c08-maintenance.log
          grep -q 'C08_CHECKPOINT_CRASH_REPLAY_PASS' build/reverse-windows-c08-maintenance.log
          grep -q 'REVERSE_WINDOWS_C08_MAINTENANCE_PASS' build/reverse-windows-c08-maintenance.log
      - name: Measure RAW vs QSSD with equal fsync semantics (no performance threshold)
        shell: bash
        run: |
          set -euo pipefail
          ./build/reverse_windows_c08_benchmark | tee build/reverse-windows-c08-benchmark.jsonl
          grep -q 'REVERSE_WINDOWS_C08_BENCHMARK_PASS' build/reverse-windows-c08-benchmark.jsonl
          python3 - <<'PY'
          import json,math,pathlib
          output=pathlib.Path("build/reverse-windows-c08-benchmark.jsonl")
          line=next(x for x in output.read_text().splitlines() if x.startswith("{"))
          metrics=json.loads(line)
          assert metrics["schema"]=="reverse-windows-c08-benchmark-v1"
          assert metrics["raw_fsync_after_every_write"] and metrics["qssd_fsync_after_every_commit"]
          assert metrics["warm_cache_not_dropped"] and metrics["single_run_not_a_speed_claim"]
          for key in ("raw_write_ms","qssd_write_ms","raw_read_ms",
                      "qssd_read_ms","qssd_full_open_ms","qssd_index_open_ms",
                      "checkpoint_build_ms","compact_ms"):
              assert math.isfinite(metrics[key]) and metrics[key]>=0, key
          assert metrics["qssd_journal_after"]<=metrics["qssd_journal_before"]
          assert metrics["qssd_cache_resident_bytes"]<=512*1024
          assert not metrics["windows_booted"]
          pathlib.Path("build/c08-measured-results.json").write_text(json.dumps(metrics,indent=2)+"\n")
          print("C08_BENCHMARK_JSON_VALIDATED results_are_host_specific=1")
          PY
      - name: Smoke test offline maintenance CLI without Windows ISO
        shell: bash
        run: |
          set -euo pipefail
          ./build/reverse_windows_boot_probe --demo-x64 --steps 200000 \
            --ram-mib 2048 --resident-mib 256 \
            --qssd-disk build/c08-cli-smoke.rqvd --create-qssd-gib 1 > /dev/null
          ./build/reverse_windows_boot_probe --qssd-checkpoint \
            --qssd-disk build/c08-cli-smoke.rqvd | tee build/c08-cli-checkpoint.json
          ./build/reverse_windows_boot_probe --qssd-compact \
            --qssd-disk build/c08-cli-smoke.rqvd | tee build/c08-cli-compact.json
          grep -q '"qssd_maintenance":"checkpoint"' build/c08-cli-checkpoint.json
          grep -q '"qssd_maintenance":"compact"' build/c08-cli-compact.json
          test -f build/c08-cli-smoke.rqvd.rqix
          echo C08_CLI_OFFLINE_MAINTENANCE_PASS
      - name: Verify C09R-1 stage4 SSE2, MXCSR and x87
        shell: bash
        run: |
          set -euo pipefail
          ./build/reverse_windows_c09r1_daz_ftz_test | tee build/reverse_windows_c09r1_daz_ftz_test.log
          grep -Fq 'C09R1_STAGE4_DAZ_FTZ_PASS' build/reverse_windows_c09r1_daz_ftz_test.log
          ./build/reverse_windows_c09r1_stage4_mxcsr_test | tee build/reverse_windows_c09r1_stage4_mxcsr_test.log
          grep -Fq 'REVERSE_WINDOWS_C09R1_STAGE4_MXCSR_PASS' build/reverse_windows_c09r1_stage4_mxcsr_test.log
          ./build/reverse_windows_c09r1_stage4_x87_test | tee build/reverse_windows_c09r1_stage4_x87_test.log
          grep -Fq 'REVERSE_WINDOWS_C09R1_STAGE4_X87_PASS' build/reverse_windows_c09r1_stage4_x87_test.log
          ./build/reverse_windows_c09r1_stage4_packed_cvt_test | tee build/reverse_windows_c09r1_stage4_packed_cvt_test.log
          grep -Fq 'REVERSE_WINDOWS_C09R1_STAGE4_PACKED_CVT_PASS' build/reverse_windows_c09r1_stage4_packed_cvt_test.log
          ./build/reverse_windows_c09r1_stage4_sse2_misc_test | tee build/reverse_windows_c09r1_stage4_sse2_misc_test.log
          grep -Fq 'REVERSE_WINDOWS_C09R1_STAGE4_SSE2_MISC_PASS' build/reverse_windows_c09r1_stage4_sse2_misc_test.log
      - name: Prove C09R-1 stage3 XMM/x87/SSE2/IDT and Ring3 context without Windows
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            reverse_windows_c09r1_sse2_fp_test \
            reverse_windows_c09r1_ring3_fpu_test \
            reverse_windows_c09r1_exact_x87_test \
            reverse_windows_c09r1_x87_mf_test; do
            ./build/"$target" | tee "build/${target}.log"
          done
          grep -q 'C09R1_SSE2_IDT_XM_UD_FXSTATE_PASS' \
            build/reverse_windows_c09r1_sse2_fp_test.log
          grep -q 'REVERSE_WINDOWS_C09R1_RING3_FPU_PASS' \
            build/reverse_windows_c09r1_ring3_fpu_test.log
          grep -q 'C09R1_X87_EXACT_IEEE_TO_EXT80_ORACLE_PASS' \
            build/reverse_windows_c09r1_exact_x87_test.log
          grep -q 'C09R1_X87_DEFERRED_MF_FNCLEX_CONTEXT_PASS' \
            build/reverse_windows_c09r1_x87_mf_test.log
          echo C09R1_STAGE3_REAL_GUEST_CONTEXT_AND_EXCEPTION_PASS
      - name: Audit REAL owner-connected hardware without ISO or Windows
        shell: bash
        run: |
          set -euo pipefail
          ./build/reverse_windows_c09r_hardware_preflight --self-test | tee build/c09r-hardware-audit.jsonl
          python3 - <<'PY'
          import json,pathlib
          lines=pathlib.Path('build/c09r-hardware-audit.jsonl').read_text().splitlines()
          report=json.loads(next(s for s in lines if s.startswith('{')))
          assert report['schema']=='reverse-windows-c09r-readiness-v1'
          assert not report['iso_loaded'] and not report['windows_executed']
          assert not report['ready_for_windows10_install']
          assert report['guest_ram_logical_bytes']==2*1024**3
          assert report['qssd_logical_bytes']==64*1024**3
          assert report['pc_cpu_cx16'] and report['pc_cpu_pae'] and report['pc_cpu_nx']
          assert report['pc_cpu_lahf_sahf'] and report['pc_cpu_prefetchw']
          assert not report['pc_cpu_sse2'] and not report['pc_cpu_x87']
          assert report['pci_ata_guest_detected']
          assert report['ether_xi_memory_aperture']
          assert report['gpu_virtual_vga_delta']
          assert report['gpu_vga_delta_upload_bytes']==4
          assert report['gpu_full_frame_bytes']==4000
          assert report['qssd_graphics_serial']>=4
          assert 'REVERSE_WINDOWS_C09R_READINESS_PASS' in lines[-1]
          print('C09R_USER_TECH_REAL_HARDWARE_AUDIT_PASS windows_ran=false')
          PY
      - name: Trace authentic CPU and BIOS execution from a SYNTHETIC El Torito ISO
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/c09_synthetic_iso.py build/c09-synthetic.iso
          ./build/reverse_windows_boot_probe --iso build/c09-synthetic.iso \
            --qssd-disk build/c09-trace.rqvd --create-qssd-gib 1 \
            --steps 1000 --ram-mib 16 --resident-mib 16 \
            --trace build/c09-iso-trace.jsonl --trace-max-events 15000 \
            --evidence build/c09-iso-boot-evidence.json \
            > build/c09-iso-probe.stdout.json
          python3 tests/c09_assert_trace.py build/c09-iso-trace.jsonl iso
          python3 - <<'PY'
          import json,pathlib
          report=json.loads(pathlib.Path("build/c09-iso-boot-evidence.json").read_text())
          assert report["source"]=="original-Mundo-X-PcMachine"
          assert report["guest_kind"]=="user-ISO"
          assert report["c09_trace"]["enabled"]
          assert not report["windows10_boot_verified"]
          assert not report["c09_trace"]["windows_pe_verified"]
          assert report["ide_c07"]["attached"]
          assert report["ide_c07"]["ata_commands"]>=1
          assert report["machine"]["cpu_mode"]=="protected16"
          assert report["machine"]["status"]=="halted"
          print("C09_PROBE_COHERENT_WITH_TRACE_PASS windows_pe=false")
          PY
      - name: Exercise terminal fault, truncated quota and invalid ISO rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/c09_synthetic_iso.py --fault-disk build/c09-unsupported.rvdisk
          set +e
          ./build/reverse_windows_boot_probe --boot-hdd \
            --disk build/c09-unsupported.rvdisk \
            --steps 128 --ram-mib 16 --resident-mib 16 \
            --trace build/c09-fault-trace.jsonl --trace-max-events 3 \
            > build/c09-fault-probe.stdout.json
          actual=$?
          set -e
          test "$actual" -eq 2
          python3 tests/c09_assert_trace.py build/c09-fault-trace.jsonl fault
          ./build/reverse_windows_boot_probe --iso build/c09-synthetic.iso \
            --qssd-disk build/c09-trace.rqvd \
            --steps 1000 --ram-mib 16 --resident-mib 16 \
            --trace build/c09-quota-trace.jsonl --trace-max-events 3 \
            > build/c09-quota-probe.stdout.json
          python3 tests/c09_assert_trace.py build/c09-quota-trace.jsonl quota
          python3 tests/c09_synthetic_iso.py --bad-catalog build/c09-bad-catalog.iso
          set +e
          ./build/reverse_windows_boot_probe --iso build/c09-bad-catalog.iso \
            --ram-mib 16 --resident-mib 16 \
            > build/c09-bad-catalog.out 2> build/c09-bad-catalog.err
          actual=$?
          set -e
          test "$actual" -eq 2
          grep -q 'El Torito validation checksum' build/c09-bad-catalog.err
          sha256sum build/c09-synthetic.iso > build/c09-iso-before.sha256
          set +e
          ./build/reverse_windows_boot_probe --iso build/c09-synthetic.iso \
            --trace build/c09-synthetic.iso --steps 20 \
            --ram-mib 16 --resident-mib 16 \
            > build/c09-trace-refused.out 2> build/c09-trace-refused.err
          actual=$?
          set -e
          test "$actual" -eq 2
          grep -q 'refuse overwrite' build/c09-trace-refused.err
          sha256sum --check build/c09-iso-before.sha256
          echo C09_UNMODIFIED_ISO_AND_NO_FALSE_BOOT_PASS
      - name: Diagnose trace and retain first observable blocker without inventing WinPE
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/c09_diagnose_trace.py build/c09-iso-trace.jsonl \
            --output build/c09-iso-diagnosis.json > build/c09-iso-diagnosis.pretty
          python3 scripts/c09_diagnose_trace.py build/c09-fault-trace.jsonl \
            --output build/c09-fault-diagnosis.json > build/c09-fault-diagnosis.pretty
          python3 scripts/c09_diagnose_trace.py build/c09-quota-trace.jsonl \
            --output build/c09-quota-diagnosis.json > build/c09-quota-diagnosis.pretty
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("build")
          iso=json.loads((root/"c09-iso-diagnosis.json").read_text())
          fault=json.loads((root/"c09-fault-diagnosis.json").read_text())
          quota=json.loads((root/"c09-quota-diagnosis.json").read_text())
          assert iso["reached_cs_0050_ip_0854"]
          assert iso["checkpoint_opcode_bytes"]=="0f00d8"
          assert iso["bios_int13_ah42_reads"]==1
          assert iso["ata_identify_commands"]==1
          assert iso["pci_cfg_out_cf8"]>=1 and iso["pci_cfg_in_cfc"]>=1
          assert iso["first_terminal_blocker"]["type"]=="guest_halt"
          assert fault["first_terminal_blocker"]["type"]=="terminal_instruction_fault"
          assert fault["first_terminal_blocker"]["first_observed"]["decoded"]=="f090"
          assert fault["truncated"] and quota["truncated"]
          assert quota["first_terminal_blocker"]["type"]=="no_terminal_fault_observed_with_truncated_trace"
          for report in (iso,fault,quota):
              assert not report["windows_10_boot_verified"]
              assert not report["winpe_boot_verified"]
              assert not report["guest_image_identity_verified"]
          print("C09_FIRST_OBSERVABLE_BLOCKER_DIAGNOSIS_PASS identity_unverified=1")
          PY
      - name: Capture actual guest APIC MMIO and ATA IRQ14 trace integration
        shell: bash
        run: |
          set -euo pipefail
          ./build/reverse_windows_c09_hardware_trace_test | tee build/c09-hardware-trace.log
          grep -q 'C09_HARDWARE_IRQ14_MMIO_QSSD_TRACE_PASS' build/c09-hardware-trace.log
          grep -q 'REVERSE_WINDOWS_C09_HARDWARE_TRACE_PASS' build/c09-hardware-trace.log
      - name: Replay protected16 group-6 through real El Torito synthetic ISO
        run: |
          g++ -std=c++17 -O0 -pthread -Ideps/mundo-X/native/include deps/mundo-X/pc-android/native/tests/pc_group6_iso_test.cpp -o build/iso-protected16-group6
          ./build/iso-protected16-group6
      - name: Generate machine-state evidence from actual x64 interpreter
        run: |
          ./build/reverse_windows_boot_probe --demo-x64 --steps 200000 --ram-mib 2048 --resident-mib 256 --evidence build/reverse-windows-x64.json
          python3 tests/check_evidence.py build/reverse-windows-x64.json
      - name: Preserve execution evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reverse-windows-c02-${{ matrix.architecture }}-evidence
          path: |
            build/reverse-windows-x64.json
            build/reverse-windows-c06-motherboard.log
            build/reverse-windows-c07-ata.log
            build/reverse-windows-c08-maintenance.log
            build/reverse-windows-c08-benchmark.jsonl
            build/c08-measured-results.json
            build/c08-cli-checkpoint.json
            build/c08-cli-compact.json
            build/c09-iso-trace.jsonl
            build/c09-iso-boot-evidence.json
            build/c09-iso-probe.stdout.json
            build/c09-fault-trace.jsonl
            build/c09-quota-trace.jsonl
            build/c09-bad-catalog.err
            build/c09-iso-diagnosis.json
            build/c09-fault-diagnosis.json
            build/c09-quota-diagnosis.json
            build/c09-hardware-trace.log
            build/c09r-hardware-audit.jsonl
            build/c02-cpu-conformance.log
            build/reverse_windows_c09r1_sse2_fp_test.log
            build/reverse_windows_c09r1_ring3_fpu_test.log
            build/reverse_windows_c09r1_exact_x87_test.log
            build/reverse_windows_c09r1_x87_mf_test.log
            build/reverse_windows_c09r1_daz_ftz_test.log
            build/reverse_windows_c09r1_stage4_mxcsr_test.log
            build/reverse_windows_c09r1_stage4_x87_test.log
            build/reverse_windows_c09r1_stage4_packed_cvt_test.log
            build/reverse_windows_c09r1_stage4_sse2_misc_test.log
          if-no-files-found: warn
