name: Prime R110 ARM64 LSL replay up to 18B

on:
  push:
    branches: [ci/prime-r110-arm64-lsl-replay]
    paths:
      - .github/benchmarks/prime-iso-arm64/apic-icr-replay-targets.json
      - .github/workflows/prime-r110-real-iso-arm64-apic-icr-replay.yml

permissions:
  contents: read

env:
  AVAILABLE_MIB: '749'
  THRESHOLD_MIB: '128'
  STOP_TARGET: '18000000000'
  PROBE_TIMEOUT_SECONDS: '4200'

jobs:
  sustained-official-iso:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify pins and test native ARM64 LSL, NMI, trap flag and CRC32C
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bench="$GITHUB_WORKSPACE/.github/benchmarks/prime-iso-arm64"
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          python3 "$bench/resolve-combined.py" "$bench/apic-icr-replay-targets.json" --reference-only-allowed \
            > "$RUNNER_TEMP/targets.tsv"
          cp "$bench/apic-icr-replay-targets.json" "$evidence/targets.json"
          sudo apt-get update -qq
          packages=(ninja-build libcurl4-openssl-dev zlib1g-dev
                    libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "${packages[@]}"
          while IFS=$'\t' read -r role product_sha core_sha; do
            product="$RUNNER_TEMP/product-$role"
            bash "$bench/checkout-product.sh" "$product" "$product_sha" "$core_sha"
            cp "$product/config/dependencies.lock.json" "$evidence/$role-dependencies.lock.json"
            gate="$RUNNER_TEMP/gate-$role"
            cmake -S "$product" -B "$gate" -G Ninja -DBUILD_TESTING=ON \
              -DREVERSE_WINDOWS_GLES_GUEST=OFF -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG'
            cmake --build "$gate" --target reverse_windows_c09r_cpu_features \
              reverse_windows_x86_system64_test reverse_windows_smp_guest_test --parallel 2
            ctest --test-dir "$gate" --no-tests=error --verbose \
              -R '^reverse_windows_(c09r_real_cpu_cx16_prefetchw|x86_system64|smp_guest)$' | tee "$evidence/$role-native-gates.log"
            grep -q 'WINDOWS_X64_TRAP_FLAG_PASS' "$evidence/$role-native-gates.log"
            grep -q 'WINDOWS_X64_CRC32C_PASS' "$evidence/$role-native-gates.log"
            grep -q 'X86_SYSTEM64_PASS' "$evidence/$role-native-gates.log"
            grep -q 'X86_LSL_PASS' "$evidence/$role-native-gates.log"
            grep -q 'SMP_ICR_REJECTION_PASS' "$evidence/$role-native-gates.log"
            grep -q 'SMP_LAPIC_NMI_PRIORITY_PASS' "$evidence/$role-native-gates.log"
            cmake -S "$bench" -B "$RUNNER_TEMP/build-$role" -G Ninja \
              -DREVERSE_WINDOWS_SOURCE="$product" -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG'
            cmake --build "$RUNNER_TEMP/build-$role" --target session_probe --parallel 2
          done < "$RUNNER_TEMP/targets.tsv"
          cc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC -o "$RUNNER_TEMP/verified_iso.so" \
            "$bench/verified_iso.c" -lcurl -pthread
          sha256sum "$RUNNER_TEMP"/build-*/session_probe "$RUNNER_TEMP/verified_iso.so" > "$evidence/native-sha256.txt"
      - name: Start the pinned LSL engine and observe 11.5B
        shell: bash
        run: |
          set -euo pipefail
          bench="$GITHUB_WORKSPACE/.github/benchmarks/prime-iso-arm64"
          evidence="$RUNNER_TEMP/evidence"
          python3 - <<'PY' > "$RUNNER_TEMP/probe-cpu"
          import os
          cpus = sorted(os.sched_getaffinity(0))[:2]
          if len(cpus) < 2:
              raise SystemExit("At least two host CPUs are required for this SMP probe")
          print(",".join(map(str, cpus)))
          PY
          {
            uname -m
            lscpu
            c++ --version
            printf 'CPU affinity %s\n' "$(cat "$RUNNER_TEMP/probe-cpu")"
          } > "$evidence/runner.txt"
          nohup bash "$bench/run-combined-role.sh" reference < /dev/null > "$evidence/reference-driver.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/reference.pid"
          python3 "$bench/late-smp-progress.py" "$RUNNER_TEMP" "$RUNNER_TEMP/reference-progress" 11500000000
      - name: Upload the 11.5B observation
        uses: actions/upload-artifact@v7
        with:
          name: prime-r110-arm64-lsl-replay-11-5b-target
          path: ${{ runner.temp }}/reference-progress/
      - name: Observe the same session at 15.2B
        shell: bash
        run: |
          set -euo pipefail
          bench="$GITHUB_WORKSPACE/.github/benchmarks/prime-iso-arm64"
          python3 "$bench/late-smp-progress.py" "$RUNNER_TEMP" "$RUNNER_TEMP/post-popfq-checkpoint" 15200000000
      - name: Upload the 15.2B observation
        uses: actions/upload-artifact@v7
        with:
          name: prime-r110-arm64-lsl-replay-15-2b-target
          path: ${{ runner.temp }}/post-popfq-checkpoint/
      - name: Observe the same session at 16.1B
        shell: bash
        run: |
          set -euo pipefail
          bench="$GITHUB_WORKSPACE/.github/benchmarks/prime-iso-arm64"
          python3 "$bench/late-smp-progress.py" "$RUNNER_TEMP" "$RUNNER_TEMP/post-crc32c-checkpoint" 16100000000
      - name: Upload the 16.1B observation
        uses: actions/upload-artifact@v7
        with:
          name: prime-r110-arm64-lsl-replay-16-1b-target
          path: ${{ runner.temp }}/post-crc32c-checkpoint/
      - name: Record the same session at 16.5B
        shell: bash
        run: |
          set -euo pipefail
          bench="$GITHUB_WORKSPACE/.github/benchmarks/prime-iso-arm64"
          python3 "$bench/late-smp-progress.py" "$RUNNER_TEMP" "$RUNNER_TEMP/pre-fault-checkpoint" 16500000000
      - name: Upload observation for the 16.5B target
        uses: actions/upload-artifact@v7
        with:
          name: prime-r110-arm64-lsl-replay-16-5b-target
          path: ${{ runner.temp }}/pre-fault-checkpoint/
      - name: Record the exact terminal state, or continue to 18B or 70 minutes
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          pid=$(cat "$RUNNER_TEMP/reference.pid")
          while [[ ! -f "$RUNNER_TEMP/reference.exit" ]]; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Reference driver ended before recording its exit code' >&2
              exit 1
            fi
            if [[ -s "$evidence/reference.stdout" ]]; then
              tail -n1 "$evidence/reference.stdout"
            fi
            sleep 20
          done
          if [[ -s "$evidence/reference.stdout" ]]; then tail -n1 "$evidence/reference.stdout"; fi
          python3 - "$evidence/reference-fault.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          terminal = Path(sys.argv[1])
          fault = json.loads(terminal.read_text()).get("cpu_fault") or {}
          rejection = fault.get("icr_low_rejection")
          if rejection is None:
              if "physical=0xfee00300" in fault.get("message", ""):
                  raise SystemExit("The ICR low failure reproduced without the attempted payload")
              print("No ICR low rejection recorded at this terminal state")
          else:
              if rejection.get("source_apic_id") != fault.get("apic_id"):
                  raise SystemExit("The ICR rejection source does not match the faulting vCPU")
              detail = json.dumps(rejection, indent=2) + "\n"
              terminal.with_name("reference-icr-low-rejection.json").write_text(detail)
              print(detail, end="")
          session = json.loads(terminal.with_name("reference-session.json").read_text())
          topology = session["cpu_topology"]
          lsl_count = topology["lsl_retired"]
          lsl_by_vcpu = [cpu["lsl_retired"] for cpu in topology["execution_by_logical_processor"]]
          if lsl_count != sum(lsl_by_vcpu):
              raise SystemExit("The aggregate LSL count differs from the per-vCPU counts")
          message = fault.get("message", "")
          repeated_lsl_stop = "opcode=0f03" in message and "two-byte opcode is not implemented" in message
          proof = {
              "guest_steps": session["boot_progress"]["session_steps"],
              "lsl_retired": lsl_count,
              "lsl_by_vcpu": lsl_by_vcpu,
              "previous_lsl_fault_reproduced": repeated_lsl_stop,
              "lapic_nmi_delivered": session["irq"]["lapic_nmi_delivered"],
              "lapic_nmi_last_delivery": session["irq"].get("lapic_nmi_last_delivery"),
              "windows_ready": session["machine"]["windows_ready"],
              "terminal_status": session["status"],
              "cpu_fault": session.get("cpu_fault"),
          }
          detail = json.dumps(proof, indent=2) + "\n"
          terminal.with_name("reference-lsl-evidence.json").write_text(detail)
          print(detail, end="")
          if repeated_lsl_stop:
              raise SystemExit("The previous unimplemented LSL fault reproduced")
          if lsl_count == 0:
              raise SystemExit("No guest LSL retirement was observed before this terminal state")
          PY
          test "$(cat "$RUNNER_TEMP/reference.exit")" = 0
      - name: Preserve late per-vCPU execution and IRQ evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prime-r110-arm64-lsl-replay-raw-final
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
