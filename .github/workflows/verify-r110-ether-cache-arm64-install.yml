name: Verify Prime R110 vector and debug ARM64 APK installation

on:
  push:
    branches: [ci/prime-r110-vector-debug-arm64-install]
    paths: [.github/workflows/verify-r110-ether-cache-arm64-install.yml]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: GitHub Actions run ID of the selected .8 build
        required: true
        type: string
      build_artifact_id:
        description: GitHub Actions artifact ID of the selected .8 ARM64 release
        required: true
        type: string
      build_artifact_digest:
        description: Artifact archive digest as sha256 followed by a colon and 64 hex digits
        required: true
        type: string
      apk_sha256:
        description: SHA-256 of the selected ARM64 release APK
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify-existing-arm64-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ID: com.reversewindows.android.prime.smp.r110.vectorstepperf
      SOURCE_SHA: b236ec8fd6b6b1c88b941289df6a503b77230020
      MUNDO_X_SHA: f71c46f3637639e3c6d259af8e5cf3deccb45a6f
      APK_VERSION_NAME: 0.3.88-perf-test.8
      APK_VERSION_CODE: '127'
      APK_NAME: REVERSE-Windows-Prime-0.3.88-perf-test.8-b236ec8fd6b6-arm64-v8a-release.apk
      BUILD_ARTIFACT_NAME: REVERSE-Windows-Prime-0.3.88-perf-test.8-b236ec8fd6b6-ARM64
      # Pin the verified .8 build values before pushing this branch.
      BUILD_RUN_ID: ${{ inputs.build_run_id || '45255433682' }}
      BUILD_ARTIFACT_ID: ${{ inputs.build_artifact_id || '14857362386' }}
      BUILD_ARTIFACT_DIGEST: ${{ inputs.build_artifact_digest || 'sha256:0c58a7733821a763d59a5067b9f5983506cd18fba2300d31c18faf6d5854cad1' }}
      EXPECTED_APK_SHA256: ${{ inputs.apk_sha256 || '373267e940409d7baca8a6af092e5362330e78935cf6a3f8038b2d7550338075' }}
    steps:
      - name: Authenticate the selected build artifact record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ && "$BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ &&
            "$BUILD_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$EXPECTED_APK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'Supply the verified build run ID, artifact ID, archive digest and APK SHA-256 before installation.\n' >&2
            exit 1
          fi
          evidence="$RUNNER_TEMP/r110-install-evidence"
          mkdir -p "$evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BUILD_ARTIFACT_ID" > "$evidence/build-artifact.json"
          jq -e --arg run "$BUILD_RUN_ID" --arg sha "$SOURCE_SHA" \
            --arg name "$BUILD_ARTIFACT_NAME" --arg digest "$BUILD_ARTIFACT_DIGEST" \
            '.workflow_run.id == ($run | tonumber) and .workflow_run.head_sha == $sha and
              .name == $name and .digest == $digest and .expired == false' "$evidence/build-artifact.json"

      - name: Download the existing ARM64 release
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: arm64-release
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Check out the synthetic ISO fixture and metadata from the APK source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          sparse-checkout: |
            tests/c09_synthetic_iso.py
            config/dependencies.lock.json
            config/integration-manifest.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Enable KVM for the x86 Android emulator
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Set up Android platform tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools build-tools;35.0.0'

      - name: Check the exact bytes to be installed
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/r110-install-evidence"
          mkdir -p "$evidence"
          apk="arm64-release/$APK_NAME"
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" "$apk" | sha256sum --check
          awk -v name="$APK_NAME" '$2 == name {print $1 "  arm64-release/" name}' \
            arm64-release/SHA256SUMS > "$evidence/archive-checksum.txt"
          sha256sum --check "$evidence/archive-checksum.txt"
          unzip -p "$apk" assets/build-source.txt | diff -u <(printf '%s\n' "$SOURCE_SHA") -
          unzip -p "$apk" assets/dependencies.lock.json | cmp - arm64-release/dependencies.lock.json
          unzip -p "$apk" assets/integration-manifest.json | cmp - arm64-release/integration-manifest.json
          cmp source/config/dependencies.lock.json arm64-release/dependencies.lock.json
          cmp source/config/integration-manifest.json arm64-release/integration-manifest.json
          grep -Fxq "source_sha=$SOURCE_SHA" arm64-release/build.txt
          grep -Fxq "mundo_x_sha=$MUNDO_X_SHA" arm64-release/build.txt
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$evidence/signature.txt"
          "$tools/zipalign" -c -P 16 -v 4 "$apk" > "$evidence/alignment.txt"
          "$tools/aapt" dump badging "$apk" > "$evidence/manifest.txt"
          grep -Fq "package: name='$APP_ID' versionCode='$APK_VERSION_CODE' versionName='$APK_VERSION_NAME'" "$evidence/manifest.txt"
          grep -Fxq "native-code: 'arm64-v8a'" "$evidence/manifest.txt"
          if grep -Fxq 'application-debuggable' "$evidence/manifest.txt"; then
            printf 'The selected release APK is debuggable.\n' >&2
            exit 1
          fi

      - name: Prepare installation, BIOS and synthetic ISO checks
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/r110-install.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          evidence="$RUNNER_TEMP/r110-install-evidence"
          apk="arm64-release/$APK_NAME"
          trap 'adb logcat -d -t 5000 > "$evidence/logcat.txt" || true' EXIT
          {
            adb shell uname -m | tr -d '\r' | tee "$evidence/architecture.txt"
            grep -Fxq 'x86_64' "$evidence/architecture.txt"
            adb shell getprop ro.build.version.sdk | tr -d '\r' | grep -Fx '30'
            abis=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')
            printf 'Android advertised ABIs %s\n' "$abis"
            [[ ",$abis," == *,arm64-v8a,* ]]
            adb shell getprop ro.dalvik.vm.native.bridge | tr -d '\r' | grep -Fx 'libndk_translation.so'
            # The disposable userdebug emulator may read the test app's own persisted diagnostic.
            adb shell getprop ro.build.type | tr -d '\r' | grep -Fx 'userdebug'
            adb root
            adb wait-for-device
            adb shell id -u | tr -d '\r' | grep -Fx '0'
            adb install --no-incremental "$apk" | tee "$evidence/package-installer.txt"
            grep -Fxq 'Success' "$evidence/package-installer.txt"
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell wm dismiss-keyguard
            activity="$APP_ID/com.reversewindows.android.MainActivity"
            for attempt in {1..20}; do
              if adb shell cmd package resolve-activity --brief "$APP_ID" | tr -d '\r' > "$evidence/activity.txt" &&
                grep -Fxq "$activity" "$evidence/activity.txt"; then
                break
              fi
              sleep 1
            done
            grep -Fxq "$activity" "$evidence/activity.txt"
            adb shell am start -W -n "$activity" | tr -d '\r' | tee "$evidence/launch.txt"
            grep -Fxq 'Status: ok' "$evidence/launch.txt"
            adb shell dumpsys package "$APP_ID" > "$evidence/package.txt"
            grep -Fq 'primaryCpuAbi=arm64-v8a' "$evidence/package.txt"
            grep -Fq "versionName=$APK_VERSION_NAME" "$evidence/package.txt"
            adb shell pidof "$APP_ID"
          } 2>&1 | tee "$evidence/install.txt"
          adb exec-out screencap -p > "$evidence/launch.png"
          python3 source/tests/c09_synthetic_iso.py "$RUNNER_TEMP/r110-boot-profile.iso"
          python3 "$RUNNER_TEMP/r110-bios-check.py" | tee "$evidence/bios.txt"
          BASH
          cat > "$RUNNER_TEMP/r110-bios-check.py" <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          package = os.environ['APP_ID']
          activity = f'{package}/com.reversewindows.android.MainActivity'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'r110-install-evidence'
          ui = '/sdcard/r110-install-ui.xml'

          def adb(*args):
              return subprocess.check_output(['adb', *args], timeout=25)

          def center(node):
              left, top, right, bottom = map(int, re.findall(r'\d+', node.get('bounds', '')))
              return (left, top, right, bottom) if right > left and bottom > top else None

          def window_xml():
              adb('shell', 'uiautomator', 'dump', ui)
              return adb('exec-out', 'cat', ui)

          def visible(field, value, *, tap=False, scroll=False, focused=False):
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline:
                  try:
                      tree = list(ET.fromstring(window_xml()).iter('node'))
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired, ET.ParseError):
                      continue
                  for node in tree:
                      if node.get(field) != value or node.get('enabled') != 'true':
                          continue
                      if focused and node.get('focused') != 'true':
                          continue
                      bounds = center(node)
                      if bounds is None:
                          continue
                      if tap:
                          left, top, right, bottom = bounds
                          adb('shell', 'input', 'tap', str((left + right) // 2), str((top + bottom) // 2))
                      return
                  if scroll:
                      for node in tree:
                          if node.get('class') != 'android.widget.ScrollView' or node.get('scrollable') != 'true':
                              continue
                          bounds = center(node)
                          if bounds is None:
                              continue
                          left, top, right, bottom = bounds
                          if right - left < 250:
                              continue
                          x = str((left + right) // 2)
                          adb('shell', 'input', 'swipe', x, str(top + (bottom-top)*4//5),
                              x, str(top + (bottom-top)//5), '300')
                          break
                  time.sleep(1)
              (evidence / 'last-window.xml').write_bytes(adb('exec-out', 'cat', ui))
              screenshot('last-window.png')
              raise AssertionError(f'Visible {field} did not reach {value}')

          def open_document(name):
              # Android 11 DocumentsUI opens the focused RecyclerView row on Enter.
              for _ in range(14):
                  raw = window_xml()
                  rows = ET.fromstring(raw).iter('node')
                  for row in rows:
                      if row.get('resource-id') != 'com.google.android.documentsui:id/item_root':
                          continue
                      if row.get('focused') != 'true' or row.get('enabled') != 'true':
                          continue
                      if any(node.get('text') == name for node in row.iter('node')):
                          (evidence / 'iso-picker-focused.xml').write_bytes(raw)
                          screenshot('iso-picker-list.png')
                          adb('shell', 'input', 'keyevent', 'KEYCODE_ENTER')
                          return
                  adb('shell', 'input', 'keyevent', 'KEYCODE_TAB')
              (evidence / 'last-window.xml').write_bytes(window_xml())
              screenshot('last-window.png')
              raise AssertionError(f'Document row did not receive focus: {name}')

          def settings():
              visible('resource-id', f'{package}:id/vm_console_menu', tap=True)
              visible('text', 'Configuración', tap=True)

          def screenshot(name):
              image = adb('exec-out', 'screencap', '-p')
              assert image.startswith(b'\x89PNG\r\n\x1a\n')
              (evidence / name).write_bytes(image)

          def verify_tsc_access(access):
              keys = ('rdtsc', 'rdmsr_tsc', 'wrmsr_tsc', 'rdmsr_tsc_adjust', 'wrmsr_tsc_adjust')
              for key in keys:
                  assert type(access[key]) is int and access[key] >= 0, (key, access[key])

          def verify_diagnostic(source, status):
              path = f'/data/user/0/{package}/files/ultimo-diagnostico.json'
              label = 'bios' if source == 'self-test' else source
              deadline = time.monotonic() + 20
              report = {}
              while time.monotonic() < deadline:
                  try:
                      raw = adb('exec-out', 'cat', path)
                      report = json.loads(raw)
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired, json.JSONDecodeError):
                      time.sleep(1)
                      continue
                  if report.get('source') == source and report.get('status') == status:
                      (evidence / f'{label}-{status}.json').write_bytes(raw)
                      break
                  time.sleep(1)
              else:
                  raise AssertionError(f'Expected saved {source} diagnostic {status}, '
                                       f'received {report.get("source")} {report.get("status")}')
              assert report['schema'] == 'reverse-windows-android-session-v1', report.get('schema')
              assert report['application_id'] == package, report.get('application_id')
              assert report['app_version'] == os.environ['APK_VERSION_NAME'], report.get('app_version')
              assert report['app_version_code'] == int(os.environ['APK_VERSION_CODE']), report.get('app_version_code')
              ether = report['ether_arm64']
              assert report['mundo_x_sha'] == ether['mundo_x_source_sha'] == os.environ['MUNDO_X_SHA'], ether
              ram_add = ether['ram_add_guest_steps']
              deflate_bypassed = report['ram_profile']['spill_codec']['encode_deflate_bypassed']
              assert type(ram_add) is int and ram_add >= 0, ram_add
              assert type(deflate_bypassed) is int and deflate_bypassed >= 0, deflate_bypassed
              for key in ('on_bus_register_steps', 'register_bus_reacquisitions',
                          'register_bus_reacquire_samples', 'register_bus_reacquire_contentions',
                          'register_bus_reacquire_wait_ns'):
                  assert type(ether[key]) is int and ether[key] >= 0, (key, ether[key])
              assert ether['register_bus_reacquire_contentions'] <= (
                  ether['register_bus_reacquire_samples']) <= ether['register_bus_reacquisitions'], ether
              irq = report['irq']
              assert type(irq['irq64_bulk_frames']) is int and 0 <= irq['irq64_bulk_frames'] <= irq['delivered'], irq
              topology = report['cpu_topology']
              crc32c_retired = topology['crc32c_retired']
              assert type(crc32c_retired) is int and crc32c_retired == 0, crc32c_retired
              for key in ('threaded_pause_yields', 'threaded_pause_turn_steps', 'threaded_pause_admissions'):
                  assert type(topology[key]) is int and topology[key] >= 0, (key, topology[key])
              verify_tsc_access(topology['tsc_access'])
              positions = topology['execution_by_logical_processor']
              assert len(positions) == topology['logical_processors'] == 16, positions
              for entry in positions:
                  assert isinstance(entry['mode'], str) and entry['mode'], entry
                  assert re.fullmatch(r'[0-9a-fA-F]{16}', entry['rip_hex']), entry
                  assert re.fullmatch(r'[0-9a-fA-F]{16}', entry['cr3_hex']), entry
                  assert 0 <= entry['cs'] <= 0xffff and 0 <= entry['flags'] <= 0xffffffff, entry
                  assert 0 <= entry['ether_arm64_steps'] <= entry['steps'], entry
                  verify_tsc_access(entry['tsc_access'])
              assert [p['steps'] for p in positions] == topology['steps_by_logical_processor']
              assert [p['ether_arm64_steps'] for p in positions] == topology['ether_arm64_steps_by_logical_processor']
              machine = report['machine']
              bsp = positions[0]
              assert (bsp['mode'], bsp['cs'], bsp['rip_hex'].lower(), bsp['flags'], bsp['steps']) == (
                  machine['cpu_mode'], machine['cs'], machine['rip_hex'].lower(), machine['flags'],
                  machine['instructions']), (bsp, machine)
              print(f'PRIME_BOOT_DIAGNOSTIC_SCHEMA_PASS source={source} status={status} '
                    f'ram_add_guest_steps={ram_add} encode_deflate_bypassed={deflate_bypassed} '
                    f'processors={len(positions)}')
              return report

          settings()
          visible('resource-id', f'{package}:id/vm_bios_test', tap=True, scroll=True)
          settings()
          visible('text', 'BIOS espera una tecla')
          screenshot('bios-wait.png')
          verify_diagnostic('self-test', 'waiting_key')
          visible('text', '‹  Consola', tap=True)
          visible('resource-id', f'{package}:id/vm_monitor', focused=True)
          adb('shell', 'input', 'keyevent', 'KEYCODE_HOME')
          time.sleep(2)
          adb('shell', 'am', 'start', '-W', '-n', activity)
          visible('resource-id', f'{package}:id/vm_monitor', focused=True)
          adb('shell', 'input', 'keyevent', 'KEYCODE_ENTER')
          settings()
          visible('text', 'La CPU invitada se detuvo')
          screenshot('bios-halted.png')
          verify_diagnostic('self-test', 'halted')
          print('PRIME_ARM64_APK_BRIDGE_BIOS_PASS host=x86_64 android=30 bridge=libndk_translation.so')

          iso = Path(os.environ['RUNNER_TEMP']) / 'r110-boot-profile.iso'
          adb('push', str(iso), f'/sdcard/Download/{iso.name}')
          # Allow the file picker to display the full row on this disposable emulator.
          adb('shell', 'wm', 'size', '720x1280')
          adb('shell', 'settings', 'put', 'system', 'accelerometer_rotation', '0')
          adb('shell', 'settings', 'put', 'system', 'user_rotation', '1')
          adb('shell', 'am', 'force-stop', package)
          adb('shell', 'am', 'start', '-W', '-n', activity)
          settings()
          visible('resource-id', f'{package}:id/vm_select_iso', tap=True, scroll=True)
          visible('resource-id', 'com.google.android.documentsui:id/sub_menu_list', tap=True)
          visible('text', iso.name)
          open_document(iso.name)
          visible('resource-id', f'{package}:id/vm_boot_iso', tap=True, scroll=True)
          report = verify_diagnostic('iso', 'halted')
          assert report['iso_bytes'] == iso.stat().st_size
          assert report['boot_progress']['handed_off']
          profile = report['boot_profile']
          assert profile['checkpoint_interval_steps'] == 50_000_000
          assert profile['first_ap_start_observed'] is None
          assert profile['checkpoints_seen'] == 0 and profile['checkpoints'] == []
          start, current = profile['start'], profile['current']
          assert start['host_elapsed_ns'] == 0 < current['host_elapsed_ns']
          assert start['steps'] < current['steps'] == report['machine']['instructions'] > 0
          assert current['mode'] == 'protected16' and int(current['ip_hex'], 16) == 0x085b, current
          for phase in (start, current):
              assert phase['started_vcpus'] == 1 and phase['sipi_targets_applied'] == 0, phase
              assert 0 <= phase['ether_arm64_steps'] <= phase['steps'] == phase['total_processor_steps'], phase
              assert 0 <= phase['rtc_irq8_delivered'] <= phase['irq_delivered'], phase
              verify_tsc_access(phase['tsc_access'])
          assert current['total_processor_steps'] == report['cpu_topology']['phase_x86_steps'], current
          assert current['ether_arm64_steps'] == report['cpu_topology']['phase_ether_arm64_steps'], current
          print('PRIME_ARM64_APK_BRIDGE_ISO_PROFILE_PASS source=synthetic-el-torito mode='
                f'{current["mode"]} steps={current["steps"]}')
          PY

      - name: Install and run the ARM64 APK through Android native translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/r110-install.sh"

      - name: Preserve installation and BIOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-r110-arm64-bridge-install-b236ec8fd6b6
          path: ${{ runner.temp }}/r110-install-evidence
          if-no-files-found: warn
