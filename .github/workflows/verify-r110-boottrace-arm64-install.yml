name: Verify Prime R110 .19 ARM64 APK in Android

on:
  push:
    branches: [ci/prime-r110-visible-boot-storage-install]
    paths: [.github/workflows/verify-r110-boottrace-arm64-install.yml]

permissions:
  actions: read
  contents: read

env:
  BUILD_RUN_ID: '45367522616'
  BUILD_CI_SHA: ab1647fa0601c71d5771c3add98548027b1b8125
  BUILD_ARTIFACT_ID: '14907831243'
  BUILD_ARCHIVE_SHA256: 3487d2841469e0ebd469a8b5f0ace65bdaee09a45125f4b3bff3a55f8c103fa0
  APK_SHA256: f43805714cbd2a54cbf207b612b044ae19a6869f6c278b8aee4236cfbff82117
  SIGNER_SHA256: 5467bbb24ef14151408bacfc75cbcd287be485d41cd2be2c0faaf770b2e72cd4
  PRODUCT_SHA: ba461db7915da262e17b86e55da316a39dbe8995
  MUNDO_X_SHA: 99dc645b80b23212f8e59603fa029caca3a07145
  APP_ID: com.reversewindows.android.prime.smp.r110.boottrace
  APK_VERSION: 0.3.88-perf-test.19
  APK_VERSION_CODE: '138'

jobs:
  arm64-bridge-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify the exact ARM64 release from its build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/r110-boottrace-install"
          archive="$RUNNER_TEMP/r110-boottrace-install-artifact.zip"
          name="REVERSE-Windows-Prime-$APK_VERSION-${PRODUCT_SHA:0:12}-ARM64"
          mkdir -p "$evidence" arm64-release
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID"
          gh api "$endpoint" > "$evidence/build-run.json"
          jq -e --arg commit "$BUILD_CI_SHA" \
            '.head_sha == $commit and .head_branch == "ci/prime-r110-visible-boot-storage-apk" and
             .status == "completed" and .conclusion == "success"' "$evidence/build-run.json"
          artifact="repos/$GITHUB_REPOSITORY/actions/artifacts/$BUILD_ARTIFACT_ID"
          gh api "$artifact" > "$evidence/build-artifact.json"
          jq -e --arg run "$BUILD_RUN_ID" --arg name "$name" --arg commit "$BUILD_CI_SHA" \
            --arg digest "sha256:$BUILD_ARCHIVE_SHA256" \
            '.workflow_run.id == ($run | tonumber) and .workflow_run.head_sha == $commit and
             .name == $name and .digest == $digest and .expired == false' "$evidence/build-artifact.json"
          gh api "$artifact/zip" > "$archive"
          printf '%s  %s\n' "$BUILD_ARCHIVE_SHA256" "$archive" | sha256sum --check | tee "$evidence/archive-check.txt"
          unzip -q "$archive" -d arm64-release
          apk="REVERSE-Windows-Prime-$APK_VERSION-${PRODUCT_SHA:0:12}-arm64-v8a-release.apk"
          (cd arm64-release && printf '%s  %s\n' "$APK_SHA256" "$apk" | sha256sum --check &&
            sha256sum --check SHA256SUMS && sha256sum "$apk") | tee "$evidence/apk-check.txt"
          printf '%s\n' "$PRODUCT_SHA" | cmp - <(unzip -p "arm64-release/$apk" assets/build-source.txt)
          printf 'APK_PATH=%s/arm64-release/%s\n' "$PWD" "$apk" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools build-tools;35.0.0'
      - name: Verify the signed APK that the emulator will install
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/r110-boottrace-install"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$APK_PATH" > "$evidence/signature.txt"
          grep -Fxq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$evidence/signature.txt"
          grep -Fxq 'Number of signers: 1' "$evidence/signature.txt"
          grep -Fq 'CN=Android Debug' "$evidence/signature.txt"
          grep -Fxq "Signer #1 certificate SHA-256 digest: $SIGNER_SHA256" "$evidence/signature.txt"
          "$tools/aapt" dump badging "$APK_PATH" > "$evidence/manifest.txt"
          grep -Fq "package: name='$APP_ID' versionCode='$APK_VERSION_CODE' versionName='$APK_VERSION'" "$evidence/manifest.txt"
          grep -Fxq "native-code: 'arm64-v8a'" "$evidence/manifest.txt"
      - name: Prepare installation and the BIOS user flow
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/r110-boottrace-install.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          evidence="$RUNNER_TEMP/r110-boottrace-install"
          trap 'adb logcat -d -t 4000 > "$evidence/logcat.txt" || true' EXIT
          adb shell uname -m | tr -d '\r' | tee "$evidence/architecture.txt" | grep -Fx 'x86_64'
          adb shell getprop ro.build.version.sdk | tr -d '\r' | grep -Fx '30'
          adb shell getprop ro.product.cpu.abilist | tr -d '\r' | tee "$evidence/android-abis.txt" | grep -F 'arm64-v8a'
          adb shell getprop ro.dalvik.vm.native.bridge | tr -d '\r' | tee "$evidence/native-bridge.txt" | grep -Fx 'libndk_translation.so'
          adb shell getprop ro.build.type | tr -d '\r' | grep -Fx 'userdebug'
          adb root
          adb wait-for-device
          adb shell id -u | tr -d '\r' | grep -Fx '0'
          adb install --no-incremental "$APK_PATH" | tee "$evidence/package-installer.txt"
          grep -Fxq 'Success' "$evidence/package-installer.txt"
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell wm dismiss-keyguard
          adb shell am start -W -n "$APP_ID/com.reversewindows.android.MainActivity" | tr -d '\r' | tee "$evidence/launch.txt"
          grep -Fxq 'Status: ok' "$evidence/launch.txt"
          adb shell dumpsys package "$APP_ID" > "$evidence/package.txt"
          grep -Fq 'primaryCpuAbi=arm64-v8a' "$evidence/package.txt"
          grep -Fq "versionName=$APK_VERSION" "$evidence/package.txt"
          grep -Eq "versionCode=$APK_VERSION_CODE([[:space:]]|$)" "$evidence/package.txt"
          adb exec-out screencap -p > "$evidence/launch.png"
          python3 "$RUNNER_TEMP/r110-boottrace-ui.py" | tee "$evidence/bios.txt"
          BASH
          cat > "$RUNNER_TEMP/r110-boottrace-ui.py" <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          package = os.environ['APP_ID']
          evidence = Path(os.environ['RUNNER_TEMP']) / 'r110-boottrace-install'
          ui = '/sdcard/r110-boottrace-ui.xml'

          def adb(*args):
              return subprocess.check_output(['adb', *args], timeout=25)

          def screenshot(name):
              image = adb('exec-out', 'screencap', '-p')
              assert image.startswith(b'\x89PNG\r\n\x1a\n')
              (evidence / name).write_bytes(image)

          def visible(field, value, *, tap=False, scroll=False, focused=False, substring=False):
              deadline = time.monotonic() + 60
              raw = b''
              while time.monotonic() < deadline:
                  try:
                      adb('shell', 'uiautomator', 'dump', ui)
                      raw = adb('exec-out', 'cat', ui)
                      tree = list(ET.fromstring(raw).iter('node'))
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired, ET.ParseError):
                      time.sleep(1)
                      continue
                  for node in tree:
                      actual = node.get(field, '')
                      matches = value in actual if substring else value == actual
                      if not matches or node.get('enabled') != 'true' or (focused and node.get('focused') != 'true'):
                          continue
                      left, top, right, bottom = map(int, re.findall(r'\d+', node.get('bounds', '')))
                      if right <= left or bottom <= top:
                          continue
                      if tap:
                          adb('shell', 'input', 'tap', str((left + right) // 2), str((top + bottom) // 2))
                      return raw
                  if scroll:
                      for node in tree:
                          if node.get('class') != 'android.widget.ScrollView' or node.get('scrollable') != 'true':
                              continue
                          left, top, right, bottom = map(int, re.findall(r'\d+', node.get('bounds', '')))
                          if right - left < 250:
                              continue
                          x = str((left + right) // 2)
                          adb('shell', 'input', 'swipe', x, str(top + (bottom - top) * 4 // 5),
                              x, str(top + (bottom - top) // 5), '300')
                          break
                  time.sleep(1)
              (evidence / 'last-window.xml').write_bytes(raw)
              screenshot('last-window.png')
              raise AssertionError(f'Visible {field} did not reach {value}')

          def verify_diagnostic(status):
              path = f'/data/user/0/{package}/files/ultimo-diagnostico.json'
              deadline = time.monotonic() + 30
              report = {}
              while time.monotonic() < deadline:
                  try:
                      raw = adb('exec-out', 'cat', path)
                      report = json.loads(raw)
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired, json.JSONDecodeError):
                      time.sleep(1)
                      continue
                  if report.get('source') == 'self-test' and report.get('status') == status:
                      (evidence / f'bios-{status}.json').write_bytes(raw)
                      break
                  time.sleep(1)
              else:
                  raise AssertionError(f'Expected BIOS {status}, received {report.get("source")} {report.get("status")}')
              assert report['schema'] == 'reverse-windows-android-session-v1'
              assert report['application_id'] == package
              assert report['app_version'] == os.environ['APK_VERSION']
              assert report['app_version_code'] == int(os.environ['APK_VERSION_CODE'])
              assert report['mundo_x_sha'] == report['ether_arm64']['mundo_x_source_sha'] == os.environ['MUNDO_X_SHA']
              progress = report['boot_progress']
              assert progress['session_steps'] > 0 and progress['restarts'] == 0, progress
              assert progress['phase_start_steps'] == 0 and progress['first_restart_steps'] == 0, progress
              assert progress['first_restart'] == '', progress
              return progress['session_steps']

          visible('resource-id', f'{package}:id/vm_console_menu', tap=True)
          visible('text', 'Configuración', tap=True)
          visible('resource-id', f'{package}:id/vm_bios_test', tap=True, scroll=True)
          status_xml = visible('text', 'BIOS espera una tecla ·', substring=True)
          (evidence / 'bios-console-status.xml').write_bytes(status_xml)
          screenshot('bios-console-status.png')
          waiting = verify_diagnostic('waiting_key')
          visible('content-desc', 'Ver registro del arranque', tap=True)
          log = visible('text', 'pasos x86 en esta sesión', substring=True, scroll=True)
          (evidence / 'arranque.xml').write_bytes(log)
          screenshot('arranque.png')
          print('PRIME_ARM64_APK_BRIDGE_ARRANQUE_PASS console_status=1 boot_log=1')
          visible('text', '‹  Consola', tap=True)
          visible('resource-id', f'{package}:id/vm_monitor', focused=True)
          adb('shell', 'input', 'keyevent', 'KEYCODE_ENTER')
          visible('text', 'La CPU invitada se detuvo ·', substring=True)
          screenshot('bios-halted.png')
          halted = verify_diagnostic('halted')
          assert halted > waiting, (halted, waiting)
          print(f'PRIME_ARM64_APK_BRIDGE_BIOS_PASS host=x86_64 android=30 bridge=libndk_translation.so waiting_steps={waiting} halted_steps={halted}')
          PY
      - name: Enable KVM for the x86_64 Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chown "$(id -u)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install, launch and use the ARM64 APK through Android native translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/r110-boottrace-install.sh"
      - name: Preserve Android installation and BIOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-r110-perf19-arm64-bridge-install-ba461db7915d
          path: ${{ runner.temp }}/r110-boottrace-install
          if-no-files-found: error
