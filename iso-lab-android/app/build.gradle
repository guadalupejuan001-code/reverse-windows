plugins { id 'com.android.application' }

android {
    namespace 'com.reversewindows.isolab'
    compileSdk 35
    defaultConfig {
        applicationId 'com.reversewindows.isolab'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
