plugins {
    id 'com.android.application'
}

def etherPreview = providers.gradleProperty('etherPreview').map { it == 'true' }.getOrElse(false)

android {
    namespace 'com.reversewindows.android'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId(etherPreview ? 'com.reversewindows.android.ether' : 'com.reversewindows.android')
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.1.5'
        manifestPlaceholders = [appLabel: etherPreview ? 'REVERSE Windows Ether' : 'REVERSE Windows']

        externalNativeBuild {
            cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }

        ndk {
            abiFilters providers.gradleProperty('androidAbi').getOrElse('arm64-v8a')
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
