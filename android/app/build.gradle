plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reversewindows.android'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.reversewindows.android'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.1.4'

        externalNativeBuild {
            cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }

        ndk {
            abiFilters providers.gradleProperty('androidAbi').getOrElse('arm64-v8a')
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
